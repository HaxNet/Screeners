<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #fff; color: #202124; }
    header { padding: 12px 14px 6px; font-weight: 700; font-size: 14px; }
    .btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 14px; border: 0; background: none; font: inherit;
      cursor: pointer; text-align: left;
    }
    .btn:hover { background: #f1f3f4; }
    .btn .k { margin-left: auto; color: #80868b; font-size: 11px; }
    .icon { width: 18px; text-align: center; }
    hr { border: 0; border-top: 1px solid #e8eaed; margin: 6px 0; }
    footer { padding: 8px 14px 12px; color: #5f6368; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    footer a { color: #1a73e8; text-decoration: none; cursor: pointer; }
    #drive { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>Screeners</header>

  <button class="btn" id="visible"><span class="icon">🖥️</span> Screenshot visible area <span class="k">⌥⇧V</span></button>
  <button class="btn" id="area"><span class="icon">✂️</span> Select area / crop <span class="k">⌥⇧A</span></button>
  <button class="btn" id="fullpage"><span class="icon">📜</span> Full page screenshot</button>
  <hr />
  <button class="btn" id="record"><span class="icon">🎥</span> Record screen <span class="k">⌥⇧R</span></button>
  <hr />
  <footer>
    <span id="drive">Drive: …</span>
    <a id="options">Options</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
